<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>닥스훈트 땅굴 대모험</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#2b1d14;display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{width:min(100vw,160vh);height:auto;touch-action:none;cursor:pointer;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ================== 기본 설정 ==================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 960, H = 600, GY = 130;           // GY = 땅 표면 높이
const DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR; ctx.scale(DPR, DPR);
const FONT = "'Jua', 'Malgun Gothic', sans-serif";
const SUBSTEP = 5;          // 빠르게 움직여도 판정이 새지 않도록 5px씩 나눠서 검사
const OFF_LIMIT = 0.45;     // 선 밖에 이 시간(초) 이상 머물면 하트 -1
const CHARM_R = 150;        // 동물 유혹 범위
const CHARM_SPEED = 210;    // 유혹 범위 안에서 강아지 최대 속도(px/s)
const CHARM_PULL = 170;     // 동물 쪽으로 끌려가는 힘(px/s, 가까울수록 셈)

// ================== 스테이지 데이터 ==================
// pts: 굴 경로 기준점 (부드러운 곡선으로 이어짐). 첫 점의 y = 이전 스테이지 끝 점의 y (이어지는 연출용)
// tol: 허용 거리, pace: 클수록 제한시간 빡빡
// bombs: 폭탄 떨어지는 위치(길 전체 중 비율), animals: 유혹하는 동물 위치(비율)
// flood: 뒤에서 차오르는 물 속도(px/s), dark: 강아지 주변만 보임
const STAGES = [
  { name:'쭉쭉 출발', tol:16, pace:140,
    intro:'강아지를 꾹 누른 채 냄새를 따라 GOAL까지 파요!',
    pts:[[30,260],[250,270],[500,250],[750,270],[935,260]] },
  { name:'꼬불꼬불', tol:15, pace:150,
    pts:[[30,260],[150,260],[260,360],[380,420],[500,330],[620,240],[740,330],[840,380],[935,300]] },
  { name:'빙글빙글', tol:14, pace:160,
    pts:[[30,300],[150,300],[260,350],[380,370],[480,345],[545,300],[530,240],[460,220],[400,250],[400,300],[460,318],[560,290],[700,275],[935,270]] },
  { name:'쾅! 폭탄 조심', tol:14, pace:115, intro:'💣 새 위험! 빨간 원에 폭탄이 떨어져요. 멈췄다가 지나가요!',
    pts:[[30,270],[200,270],[330,360],[480,380],[620,300],[760,260],[935,330]], bombs:[0.3,0.55,0.8] },
  { name:'빙글빙글 폭탄', tol:13, pace:115,
    pts:[[30,330],[140,330],[230,400],[320,430],[380,380],[360,320],[300,320],[290,380],[350,450],[480,460],[600,400],[650,330],[610,270],[550,290],[560,360],[650,400],[800,380],[935,300]],
    bombs:[0.22,0.5,0.78] },
  { name:'토끼 친구들', tol:14, pace:120, intro:'🐰 새 위험! 친구들 근처에선 느려지고 그쪽으로 끌려가요. 버텨요!',
    pts:[[30,300],[200,310],[350,250],[500,260],[650,360],[800,380],[935,300]], animals:[0.33,0.68] },
  { name:'유혹의 지그재그', tol:13, pace:105,
    pts:[[30,300],[140,300],[220,470],[320,220],[420,470],[520,220],[620,470],[720,260],[820,400],[935,350]],
    animals:[0.3,0.65], bombs:[0.47,0.85] },
  { name:'물이 차올라!', tol:13, pace:85, flood:115, intro:'🌊 새 위험! 뒤에서 물이 따라와요. 멈추면 잡혀요!',
    pts:[[30,350],[200,350],[300,450],[200,540],[400,560],[600,520],[700,420],[600,330],[450,280],[350,200],[550,175],[750,220],[850,320],[935,400]] },
  { name:'깜깜한 땅속', tol:13, pace:120, dark:true, intro:'🔦 새 위험! 너무 깊어서 강아지 주변만 보여요!',
    pts:[[30,400],[180,400],[300,330],[420,300],[500,340],[480,420],[400,430],[380,370],[450,300],[600,260],[720,330],[760,430],[700,500],[620,460],[660,390],[800,360],[935,380]] },
  { name:'대모험', tol:12, pace:80, flood:85, intro:'🏆 마지막! 폭탄 + 친구들 + 물. 전부 이겨내요!',
    pts:[[30,380],[160,380],[260,300],[220,220],[150,250],[180,320],[300,350],[420,460],[540,500],[620,420],[560,350],[480,380],[520,450],[680,500],[800,420],[760,300],[860,230],[935,260]],
    bombs:[0.3,0.6], animals:[0.45,0.82] },
];

// ================== 저장 (브라우저별) ==================
let save = { stars: [] };
try { save = JSON.parse(localStorage.getItem('dachs-dig2') || '') || save; } catch (e) {}
function persist(){ try { localStorage.setItem('dachs-dig2', JSON.stringify(save)); } catch (e) {} }
const unlocked = i => i === 0 || (save.stars[i-1] || 0) > 0;

// ================== 사운드 ==================
let AC = null;
function beep(f, d = 0.08, type = 'square', v = 0.05, slide = 0){
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d);
}
const sfx = {
  dig:  () => beep(90 + Math.random()*40, 0.05, 'triangle', 0.03),
  bone: () => { beep(880,0.08,'square',0.05); setTimeout(()=>beep(1320,0.1,'square',0.05),70); },
  hurt: () => beep(300, 0.3, 'sawtooth', 0.06, 0.3),
  boom: () => { beep(120, 0.4, 'sawtooth', 0.08, 0.2); beep(60, 0.5, 'square', 0.05, 0.5); },
  tick: () => beep(1200, 0.03, 'square', 0.02),
  win:  () => [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.15,'square',0.05),i*110)),
  lose: () => [400,300,200].forEach((f,i)=>setTimeout(()=>beep(f,0.2,'triangle',0.06),i*150)),
  click:() => beep(660, 0.05, 'square', 0.04),
};

// ================== 유틸 ==================
function rng(seed){ return () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646); }
const hyp = Math.hypot;
const ease = p => p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2;

// Catmull-Rom 곡선 → 4px 간격으로 재샘플링
function buildPath(pts){
  const P = [pts[0], ...pts, pts[pts.length-1]], raw = [];
  for (let i = 1; i < P.length - 2; i++){
    const [p0,p1,p2,p3] = [P[i-1],P[i],P[i+1],P[i+2]];
    for (let t = 0; t < 1; t += 0.02){
      const t2 = t*t, t3 = t2*t;
      const f = k => 0.5*((2*p1[k]) + (-p0[k]+p2[k])*t + (2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2 + (-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3);
      raw.push([f(0), f(1)]);
    }
  }
  raw.push(pts[pts.length-1]);
  const S = [raw[0]];
  for (let i = 1; i < raw.length; i++){
    let a = S[S.length-1]; const b = raw[i];
    let d = hyp(b[0]-a[0], b[1]-a[1]);
    while (d >= 4){ const k = 4/d; a = [a[0]+(b[0]-a[0])*k, a[1]+(b[1]-a[1])*k]; S.push(a); d = hyp(b[0]-a[0], b[1]-a[1]); }
  }
  return S;
}

// 흙 배경 미리 그리기 (깊은 스테이지일수록 어두운 흙)
function makeDirt(seed, deep){
  const c = document.createElement('canvas'); c.width = W*DPR; c.height = H*DPR;
  const g = c.getContext('2d'); g.scale(DPR, DPR); const r = rng(seed);
  const grad = g.createLinearGradient(0, GY, 0, H);
  grad.addColorStop(0, deep ? '#9c6a42' : '#c48a57'); grad.addColorStop(1, deep ? '#5e3a22' : '#8a5532');
  g.fillStyle = grad; g.fillRect(0, GY, W, H-GY);
  for (let k = 0; k < 4; k++){
    const y = GY + 70 + k*115 + r()*30;
    g.fillStyle = 'rgba(60,30,10,0.07)'; g.beginPath(); g.moveTo(0, y);
    for (let x = 0; x <= W; x += 30) g.lineTo(x, y + Math.sin(x*0.012 + k*2 + seed)*10);
    g.lineTo(W, y+45); g.lineTo(0, y+45); g.fill();
  }
  for (let i = 0; i < 700; i++){
    g.fillStyle = r() < 0.5 ? 'rgba(60,30,10,0.18)' : 'rgba(255,230,190,0.15)';
    g.fillRect(r()*W, GY + 10 + r()*(H-GY), 2 + r()*2, 2 + r()*2);
  }
  for (let i = 0; i < 22; i++){
    const x = r()*W, y = GY + 40 + r()*(H-GY-50), rw = 6 + r()*10;
    g.fillStyle = ['#9c8b7a','#857566','#b3a291'][i%3];
    g.beginPath(); g.ellipse(x, y, rw, rw*0.7, r()*3, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.25)'; g.beginPath(); g.ellipse(x - rw*0.3, y - rw*0.25, rw*0.35, rw*0.2, 0, 0, 7); g.fill();
  }
  g.strokeStyle = '#6b4a2b'; g.lineWidth = 2; g.lineCap = 'round';
  for (let i = 0; i < 10; i++){
    let x = r()*W, y = GY + 8; g.beginPath(); g.moveTo(x, y);
    for (let j = 0; j < 5; j++){ x += (r()-0.5)*14; y += 6 + r()*6; g.lineTo(x, y); }
    g.stroke();
  }
  return c;
}

// 어둠 스테이지용 오버레이
const fog = document.createElement('canvas'); fog.width = W*DPR; fog.height = H*DPR;
const fctx = fog.getContext('2d'); fctx.scale(DPR, DPR);

// ================== 입력 ==================
let mx = W/2, my = H/2, btns = [];
function toLocal(e){ const r = cv.getBoundingClientRect(); mx = (e.clientX - r.left)/r.width*W; my = (e.clientY - r.top)/r.height*H; }
cv.addEventListener('pointerdown', e => {
  toLocal(e); cv.setPointerCapture(e.pointerId);
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) {} }
  for (const b of btns) if (mx > b.x && mx < b.x+b.w && my > b.y && my < b.y+b.h){ sfx.click(); b.cb(); return; }
  if (scene === 'play') grab();
});
cv.addEventListener('pointermove', toLocal);
const up = () => { if (G) G.drag = false; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
window.addEventListener('keydown', e => {
  if (e.key === 'r' && G && (scene === 'play' || scene === 'end')) startStage(G.i);
  if (e.key === 'Escape') scene = 'menu';
});

// ================== 게임 상태 ==================
let scene = 'menu', G = null, T = 0, TR = null;

function makeStage(i){
  const st = STAGES[i], path = buildPath(st.pts), N = path.length;
  const time = Math.ceil(N*4 / st.pace) + 2;
  const normalAt = k => { const a = path[Math.max(0,k-3)], b = path[Math.min(N-1,k+3)], l = hyp(b[0]-a[0], b[1]-a[1]) || 1; return [-(b[1]-a[1])/l, (b[0]-a[0])/l]; };
  const animals = (st.animals || []).map((f, n) => {
    const k = Math.floor(N*f), nr = normalAt(k);
    let side = n % 2 ? 1 : -1;
    const y = path[k][1] + nr[1]*85*side;
    if (y < GY + 35 || y > H - 30) side = -side;
    return { k, bx: path[k][0] + nr[0]*85*side, by: path[k][1] + nr[1]*85*side, x: 0, y: 0, type: n % 2 ? 'badger' : 'rabbit', ph: n*1.7 };
  });
  const bombs = (st.bombs || []).map((f, n) => {
    const k = Math.floor(N*f);
    return { x: path[k][0], y: path[k][1], r: 46, period: 3.2, warn: 1.3, next: 2.2 + n*1.1 };
  });
  return {
    i, st, path, N, tol: st.tol, time, tLeft: time, clock: 0,
    dirt: makeDirt(1234 + i*777, !!st.dark),
    dog: { x: path[0][0], y: path[0][1], ang: 0, walk: 0, dispAng: 0 },
    prog: 0, trail: [[path[0][0], path[0][1]]], offT: 0,
    hearts: 3, bones: [0.2, 0.5, 0.75].map(f => ({ k: Math.floor(N*f), got: false })),
    animals, bombs, booms: [], charm: null,
    flood: st.flood ? { idx: -st.flood/4 * 2.5, v: st.flood/4 } : null,
    got: 0, onDist: 0, totDist: 0, inv: 0, shake: 0, off: 0,
    started: false, drag: false, parts: [], pops: [], result: null,
  };
}
function startStage(i){ G = makeStage(i); scene = 'play'; }

// 다음 스테이지로: GOAL이 왼쪽으로 밀려와 새 출발점이 되고, 강아지는 계속 걸어감
function goNext(){
  if (G.i >= STAGES.length - 1){ scene = 'menu'; return; }
  TR = { old: G, next: makeStage(G.i + 1), p: 0 };
  scene = 'trans';
}

function grab(){
  const d = hyp(mx - G.dog.x, my - G.dog.y);
  if (d < 60){ G.drag = true; G.started = true; }
  else if (G.started) pop(mx, my, '강아지를 잡고 끌어요!', '#fff');
}

function pop(x, y, text, color){ G.pops.push({ x, y, text, color, t: 1.3 }); }

function finish(win, reason){
  const acc = G.totDist > 0 ? G.onDist / G.totDist : 1;
  if (win){
    const score = Math.round(acc*1000 + G.tLeft*30 + G.got*150 + G.hearts*100);
    const stars = (acc >= 0.9 && G.hearts === 3) ? 3 : (acc >= 0.75 && G.hearts >= 2) ? 2 : 1;
    save.stars[G.i] = Math.max(save.stars[G.i] || 0, stars);
    persist(); sfx.win();
    G.result = { win, score, stars, acc };
  } else { sfx.lose(); G.result = { win, reason, acc }; }
  G.drag = false; scene = 'end';
}

function update(dt){
  T += dt;
  if (scene === 'trans'){
    TR.p += dt / 1.6;
    if (TR.p >= 1){ G = TR.next; TR = null; scene = 'play'; }
    return;
  }
  if (scene !== 'play' || !G) return;
  const g = G, d = g.dog;
  g.inv = Math.max(0, g.inv - dt); g.shake = Math.max(0, g.shake - dt);
  if (g.started){ g.tLeft -= dt; g.clock += dt; }
  if (g.tLeft <= 0){ g.tLeft = 0; return finish(false, '시간 초과!'); }

  // 동물 움직임 + 유혹
  let speed = Infinity, px = 0, py = 0; g.charm = null;
  for (const a of g.animals){
    a.x = a.bx + Math.sin(T*1.3 + a.ph)*22; a.y = a.by + Math.sin(T*2.6 + a.ph)*4;
    const dd = hyp(a.x - d.x, a.y - d.y);
    if (dd < CHARM_R && g.started){
      speed = CHARM_SPEED; const f = 1 - dd/CHARM_R;
      px += (a.x - d.x)/dd * CHARM_PULL * f; py += (a.y - d.y)/dd * CHARM_PULL * f;
      g.charm = a;
    }
  }

  // 이동: 마우스에 바로 붙음 (유혹 중엔 느려짐). 5px씩 쪼개서 매 칸마다 판정
  const moveBy = (vx, vy) => {
    const dist = hyp(vx, vy); if (dist < 0.01) return false;
    let left = dist;
    while (left > 0.01){
      const s = Math.min(SUBSTEP, left); left -= s;
      d.x = Math.max(8, Math.min(W - 8, d.x + vx/dist*s));
      d.y = Math.max(GY + 14, Math.min(H - 12, d.y + vy/dist*s));
      d.walk += s * 0.15;
      if (track(s) || scene !== 'play') return true;
    }
    return false;
  };
  if (g.drag){
    const dx = mx - d.x, dy = my - d.y, dist = hyp(dx, dy);
    if (dist > 1){
      d.ang = Math.atan2(dy, dx);
      const m = Math.min(dist, speed*dt);
      if (!moveBy(dx/dist*m, dy/dist*m) && (px || py)) moveBy(px*dt, py*dt);
    } else if (px || py) moveBy(px*dt, py*dt);
  } else track(0);
  if (scene !== 'play') return;
  let da = d.ang - d.dispAng; da = Math.atan2(Math.sin(da), Math.cos(da)); d.dispAng += da * Math.min(1, dt*20);

  // 선 밖에 오래 머물면 하트 -1
  if (g.started && g.drag && g.off > g.tol){
    g.offT += dt;
    if (g.offT > OFF_LIMIT && g.inv <= 0){ hurt('앗! 길을 벗어났어요'); if (scene !== 'play') return; }
  } else g.offT = 0;

  // 폭탄
  for (const b of g.bombs){
    if (g.clock >= b.next - b.warn && g.clock - dt < b.next - b.warn) sfx.tick();
    if (g.clock >= b.next){
      b.next += b.period; sfx.boom(); g.shake = Math.max(g.shake, 0.25);
      g.booms.push({ x: b.x, y: b.y, r: b.r, t: 0.45 });
      for (let k = 0; k < 18; k++){ const a = Math.random()*7, v = 80 + Math.random()*160; g.parts.push({ x: b.x, y: b.y, vx: Math.cos(a)*v, vy: Math.sin(a)*v - 80, t: 0.7, s: 3 + Math.random()*4 }); }
      if (hyp(d.x - b.x, d.y - b.y) < b.r + 10 && g.inv <= 0){ hurt('쾅! 폭탄에 맞았어요'); if (scene !== 'play') return; }
    }
  }
  for (const b of g.booms) b.t -= dt;
  g.booms = g.booms.filter(b => b.t > 0);

  // 차오르는 물
  if (g.flood && g.started){
    g.flood.idx += g.flood.v * dt;
    if (g.flood.idx >= g.prog - 3 && g.inv <= 0){
      g.flood.idx = g.prog - 70;
      hurt('물에 따라잡혔어요!'); if (scene !== 'play') return;
    }
  }

  for (const b of g.bones) if (!b.got && hyp(g.path[b.k][0]-d.x, g.path[b.k][1]-d.y) < 24){
    b.got = true; g.got++; sfx.bone(); pop(d.x, d.y - 30, '뼈다귀 +150', '#fff6b0');
  }
  for (const p of g.parts){ p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 400*dt; p.t -= dt; }
  g.parts = g.parts.filter(p => p.t > 0);
  for (const p of g.pops){ p.t -= dt; p.y -= 30*dt; }
  g.pops = g.pops.filter(p => p.t > 0);

  if (g.prog >= g.N - 3) finish(true);
}

// 판정 한 번: 진행도 갱신, 크게 벗어나면 하트 -1. 벌칙이 일어나면 true
function track(step){
  const g = G, d = g.dog;
  let best = g.prog, bd = 1e9;
  const lo = Math.max(0, g.prog - 25), hi = Math.min(g.N - 1, g.prog + 40);
  for (let j = lo; j <= hi; j++){ const q = hyp(g.path[j][0]-d.x, g.path[j][1]-d.y); if (q < bd){ bd = q; best = j; } }
  g.off = bd;
  if (step > 0){
    g.totDist += step;
    if (bd <= g.tol) g.onDist += step;
    const last = g.trail[g.trail.length-1];
    if (hyp(last[0]-d.x, last[1]-d.y) > 3){
      g.trail.push([d.x, d.y]);
      if (Math.random() < 0.25) sfx.dig();
      if (Math.random() < 0.6) g.parts.push({ x: d.x - Math.cos(d.ang)*25, y: d.y - Math.sin(d.ang)*10, vx: -Math.cos(d.ang)*80 + (Math.random()-0.5)*120, vy: -60 - Math.random()*80, t: 0.6, s: 2 + Math.random()*3 });
    }
  }
  if (bd <= g.tol){ g.prog = best; return false; }
  if (bd > g.tol * 2 && g.inv <= 0){ hurt('앗! 길을 벗어났어요'); return true; }
  return false;
}

function hurt(msg){
  const g = G, d = g.dog;
  g.hearts--; g.inv = 1.0; g.shake = 0.4; g.drag = false; g.offT = 0; sfx.hurt();
  pop(d.x, d.y - 30, msg, '#ffdddd');
  const p = g.path[g.prog]; d.x = p[0]; d.y = p[1];
  g.trail.push([d.x, d.y, 'break']);
  if (g.hearts <= 0) finish(false, msg.replace('앗! ', '') );
}

// ================== 그리기 도우미 ==================
function rr(x, y, w, h, r){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function text(s, x, y, size, color = '#fff', align = 'center', stroke = null){
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke){ ctx.lineWidth = size/6; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function button(x, y, w, h, label, cb, color = '#ffb347', enabled = true){
  const hover = enabled && mx > x && mx < x+w && my > y && my < y+h;
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; rr(x, y+5, w, h, 16); ctx.fill();
  ctx.fillStyle = enabled ? color : '#999'; rr(x, y - (hover ? 2 : 0), w, h, 16); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 3; ctx.stroke();
  text(label, x + w/2, y + h/2 - (hover ? 2 : 0), Math.min(26, h*0.45), '#fff', 'center', 'rgba(90,40,10,0.6)');
  if (enabled) btns.push({ x, y, w, h, cb });
}
function star(x, y, r, on){
  ctx.beginPath();
  for (let i = 0; i < 10; i++){ const a = -Math.PI/2 + i*Math.PI/5, rad = i % 2 ? r*0.45 : r; ctx.lineTo(x + Math.cos(a)*rad, y + Math.sin(a)*rad); }
  ctx.closePath(); ctx.fillStyle = on ? '#ffd23f' : 'rgba(0,0,0,0.25)'; ctx.fill();
  ctx.strokeStyle = on ? '#e08e0b' : 'rgba(255,255,255,0.3)'; ctx.lineWidth = 2; ctx.stroke();
}
function heart(x, y, s, on, color = '#ff5a7a'){
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(0, 6); ctx.bezierCurveTo(-14, -4, -8, -16, 0, -8); ctx.bezierCurveTo(8, -16, 14, -4, 0, 6);
  ctx.fillStyle = on ? color : 'rgba(0,0,0,0.3)'; ctx.fill(); ctx.restore();
}
function bone(x, y, s = 1, rot = 0){
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.fillStyle = '#fffaf0'; ctx.strokeStyle = '#c9b28f'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(-10, -3.5, 20, 7, 3);
  for (const [cx, cy] of [[-11,-4],[-11,4],[11,-4],[11,4]]){ ctx.moveTo(cx+5, cy); ctx.arc(cx, cy, 5, 0, 7); }
  ctx.stroke(); ctx.fill(); ctx.restore();
}

// 닥스훈트 (오른쪽을 보는 기준으로 그림)
function drawDog(x, y, ang, walk, s = 1, hurt = false, charmed = false){
  ctx.save(); ctx.translate(x, y);
  if (Math.cos(ang) < 0){ ctx.scale(-s, s); ctx.rotate(Math.PI - ang); } else { ctx.scale(s, s); ctx.rotate(ang); }
  const body = hurt ? '#e8806a' : '#c0702e', dark = '#7a3f17';
  const sw = Math.sin(walk);
  ctx.strokeStyle = body; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-27, -4); ctx.quadraticCurveTo(-36, -10, -40 + Math.sin(T*14)*2, -18 + Math.cos(T*14)*3); ctx.stroke();
  ctx.fillStyle = dark;
  [[-20, sw], [-12, -sw], [14, -sw], [22, sw]].forEach(([lx, ph]) => {
    ctx.save(); ctx.translate(lx, 6); ctx.rotate(ph*0.5); rr(-3, 0, 6, 12, 3); ctx.fill(); ctx.restore();
  });
  ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(0, 0, 31, 11.5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#e8ad70'; ctx.beginPath(); ctx.ellipse(2, 6, 22, 4.5, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#e63950'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(24, -9); ctx.lineTo(27, 6); ctx.stroke();
  ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(27, 8, 2.5, 0, 7); ctx.fill();
  ctx.fillStyle = body; ctx.beginPath(); ctx.arc(33, -8, 11, 0, 7); ctx.fill();
  ctx.fillStyle = '#d68a45'; ctx.beginPath(); ctx.ellipse(43, -4, 10, 6.5, 0.1, 0, 7); ctx.fill();
  ctx.fillStyle = '#2a1a12'; ctx.beginPath(); ctx.arc(52, -6, 3.2, 0, 7); ctx.fill();
  if (hurt){ ctx.strokeStyle = '#2a1a12'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(33, -15); ctx.lineTo(38, -11); ctx.moveTo(38, -15); ctx.lineTo(33, -11); ctx.stroke(); }
  else if (charmed){ heart(36, -11, 0.42, true, '#ff3d6e'); }
  else { ctx.fillStyle = '#2a1a12'; ctx.beginPath(); ctx.arc(36, -12, 2.6, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(36.8, -12.8, 0.9, 0, 7); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,120,140,0.5)'; ctx.beginPath(); ctx.arc(39, -3, 2.8, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(28, -14); ctx.rotate(0.35 + Math.sin(walk*0.8)*0.2);
  ctx.fillStyle = dark; ctx.beginPath(); ctx.ellipse(0, 9, 5.5, 11, 0, 0, 7); ctx.fill(); ctx.restore();
  ctx.restore();
}

// 유혹하는 동물: 토끼 / 오소리
function drawAnimal(a, faceLeft){
  ctx.save(); ctx.translate(a.x, a.y); if (faceLeft) ctx.scale(-1, 1);
  const hop = Math.abs(Math.sin(T*5 + a.ph))*4; ctx.translate(0, -hop);
  ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.ellipse(0, 14 + hop, 20, 4, 0, 0, 7); ctx.fill();
  if (a.type === 'rabbit'){
    ctx.fillStyle = '#fbf6ee';
    for (const ex of [4, 11]){ ctx.save(); ctx.translate(ex, -14); ctx.rotate(-0.15 + Math.sin(T*3 + ex)*0.12); ctx.beginPath(); ctx.ellipse(0, -10, 4.5, 12, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#ffb3c6'; ctx.beginPath(); ctx.ellipse(0, -10, 2, 8, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#fbf6ee'; ctx.restore(); }
    ctx.beginPath(); ctx.ellipse(-4, 4, 16, 12, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(9, -6, 10, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(-19, 2, 5, 0, 7); ctx.fill();
    ctx.fillStyle = '#2a1a12'; ctx.beginPath(); ctx.arc(13, -8, 2, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff8fab'; ctx.beginPath(); ctx.arc(19, -4, 2, 0, 7); ctx.fill();
  } else {
    ctx.fillStyle = '#7d7f86'; ctx.beginPath(); ctx.ellipse(-4, 4, 19, 11, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#2f3036'; ctx.beginPath(); ctx.ellipse(12, -2, 12, 9, 0.2, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(13, -4, 11, 2.6, 0.2, 0, 7); ctx.fill();
    ctx.fillStyle = '#2f3036'; ctx.beginPath(); ctx.arc(6, -10, 3.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(23, 0, 2.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(15, -1, 1.6, 0, 7); ctx.fill();
    ctx.fillStyle = '#2f3036'; [[-14,13],[-4,13],[6,13]].forEach(([lx,ly]) => { rr(lx, ly-4, 5, 7, 2); ctx.fill(); });
  }
  ctx.restore();
}

function drawBomb(x, y){
  ctx.fillStyle = '#26232a'; ctx.beginPath(); ctx.arc(x, y, 11, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.arc(x - 4, y - 4, 3.5, 0, 7); ctx.fill();
  ctx.strokeStyle = '#8b6a4a'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(x + 5, y - 9); ctx.quadraticCurveTo(x + 10, y - 18, x + 6, y - 22); ctx.stroke();
  ctx.fillStyle = Math.floor(T*20) % 2 ? '#ffd23f' : '#ff7a1a'; ctx.beginPath(); ctx.arc(x + 6, y - 23, 3.5, 0, 7); ctx.fill();
}

function drawSky(){
  const g = ctx.createLinearGradient(0, 0, 0, GY);
  g.addColorStop(0, '#8fd3ff'); g.addColorStop(1, '#d8f1ff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, GY);
  ctx.fillStyle = '#ffe066'; ctx.beginPath(); ctx.arc(880, 45, 26, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  for (let i = 0; i < 4; i++){
    const x = ((i*260 + T*12) % (W + 160)) - 80, y = 30 + (i%2)*28;
    ctx.beginPath(); ctx.arc(x, y, 16, 0, 7); ctx.arc(x+18, y-8, 20, 0, 7); ctx.arc(x+38, y, 15, 0, 7); ctx.fill();
  }
}
function drawGrass(ox = 0){
  ctx.fillStyle = '#6cc04a'; ctx.beginPath(); ctx.moveTo(0, GY+10);
  for (let x = 0; x <= W; x += 12) ctx.lineTo(x, GY - 4 - (Math.floor((x - ox)/12) % 2 ? 5 : 0));
  ctx.lineTo(W, GY+10); ctx.fill();
  ctx.fillStyle = '#4fa233'; ctx.fillRect(0, GY+4, W, 8);
  for (let i = -1; i < 9; i++){
    const x = ((60 + i*120 + (i%3)*17 + ox) % (W + 120) + W + 120) % (W + 120) - 60;
    ctx.fillStyle = ['#ff8fab','#fff','#ffd23f'][(i+3)%3]; ctx.beginPath(); ctx.arc(x, GY-10, 4, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffcf33'; ctx.beginPath(); ctx.arc(x, GY-10, 1.6, 0, 7); ctx.fill();
  }
}
function strokePath(pts, from, to, width, color){
  if (to - from < 1) return;
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath();
  for (let i = Math.max(0, from); i <= to; i++) i === Math.max(0, from) ? ctx.moveTo(pts[i][0], pts[i][1]) : ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
}
function strokeTrail(tr, width, color){
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath();
  tr.forEach((p, i) => (i === 0 || p[2] === 'break') ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1]));
  ctx.stroke();
}

// 냄새 자국: 은은한 노란 기운 + 반짝이는 점 + 피어오르는 냄새
function drawScent(g){
  const P = g.path, from = g.prog;
  strokePath(P, from, g.N-1, g.tol*2, 'rgba(255,214,120,0.10)');
  for (let j = from + 2; j < g.N; j += 3){
    const tw = 0.5 + 0.5*Math.sin(T*4 - j*0.35);
    ctx.fillStyle = `rgba(255,${215 + tw*30},${120 + tw*60},${0.35 + tw*0.45})`;
    ctx.beginPath(); ctx.arc(P[j][0], P[j][1], 1.8 + tw*1.6, 0, 7); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(255,230,160,0.45)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (let j = from + 12; j < g.N; j += 24){
    const life = (T*0.8 + j*0.13) % 1, x = P[j][0], y = P[j][1] - life*22;
    ctx.globalAlpha = 1 - life; ctx.beginPath();
    ctx.moveTo(x - 4, y); ctx.quadraticCurveTo(x - 2, y - 5, x, y); ctx.quadraticCurveTo(x + 2, y + 5, x + 4, y); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// 한 스테이지의 땅속 세계 그리기 (ox = 화면 가로 이동량, withDog = 강아지 그릴지)
function drawWorld(g, ox, withDog){
  ctx.save(); ctx.translate(ox, 0);
  ctx.drawImage(g.dirt, 0, 0, W, H);
  const s0 = g.path[0], e = g.path[g.N-1], d = g.dog;
  ctx.fillStyle = '#3b2213'; ctx.beginPath(); ctx.ellipse(s0[0], s0[1], 20, 18, 0, 0, 7); ctx.fill();

  // 폭탄 경고 원 (냄새 아래)
  for (const b of g.bombs){
    const q = (g.clock - (b.next - b.warn)) / b.warn;
    if (q >= 0 && q <= 1){
      ctx.fillStyle = `rgba(255,60,60,${0.12 + 0.18*Math.abs(Math.sin(T*(8 + q*14)))})`;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(255,70,70,0.8)'; ctx.lineWidth = 3; ctx.setLineDash([8, 6]);
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    } else if (g.bombs.length && g.started){
      ctx.strokeStyle = 'rgba(255,90,90,0.25)'; ctx.lineWidth = 2; ctx.setLineDash([4, 8]);
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    }
  }

  drawScent(g);
  strokeTrail(g.trail, 34, '#4a2a16'); strokeTrail(g.trail, 26, '#5e3820');

  // 물
  if (g.flood && g.flood.idx > 0){
    const fi = Math.min(g.N-1, Math.floor(g.flood.idx));
    strokePath(g.path, 0, fi, 28, 'rgba(60,140,220,0.92)');
    strokePath(g.path, 0, fi, 14, 'rgba(140,205,255,0.7)');
    const f = g.path[fi];
    for (let k = 0; k < 3; k++){ ctx.fillStyle = 'rgba(200,235,255,0.8)'; ctx.beginPath(); ctx.arc(f[0] + Math.sin(T*9 + k*2)*6, f[1] + Math.cos(T*7 + k*2)*6, 3 + k, 0, 7); ctx.fill(); }
  }

  // GOAL
  ctx.save(); ctx.translate(e[0] - 10, e[1]);
  ctx.fillStyle = '#3b2213'; ctx.beginPath(); ctx.ellipse(0, 0, 28, 24, 0, 0, 7); ctx.fill();
  bone(0, 2 + Math.sin(T*4)*2, 1.4, -0.3);
  text('GOAL', 0, -36, 18, '#fff', 'center', '#5e3820');
  ctx.restore();

  for (const b of g.bones) if (!b.got){ const p = g.path[b.k]; bone(p[0], p[1] + Math.sin(T*3 + b.k)*3, 1, Math.sin(T*2 + b.k)*0.3); }

  // 동물 + 유혹 표시
  for (const a of g.animals){
    if (!a.x){ a.x = a.bx; a.y = a.by; }
    drawAnimal(a, a.x > d.x);
    if (g.charm === a){
      for (let k = 0; k < 3; k++){
        const t = (T*1.2 + k/3) % 1;
        ctx.globalAlpha = 1 - t; heart(a.x + (d.x - a.x)*t, a.y + (d.y - a.y)*t - Math.sin(t*Math.PI)*25, 0.6, true, '#ff6f91');
      }
      ctx.globalAlpha = 1;
    }
  }

  // 떨어지는 폭탄 + 폭발
  for (const b of g.bombs){
    const q = (g.clock - (b.next - b.warn)) / b.warn;
    if (q >= 0 && q <= 1) drawBomb(b.x, -20 + (b.y + 20)*q*q);
  }
  for (const b of g.booms){
    const t = 1 - b.t/0.45;
    ctx.fillStyle = `rgba(255,${200 - t*120},60,${1 - t})`; ctx.beginPath(); ctx.arc(b.x, b.y, b.r*(0.6 + t*0.6), 0, 7); ctx.fill();
    ctx.fillStyle = `rgba(255,255,220,${1 - t})`; ctx.beginPath(); ctx.arc(b.x, b.y, b.r*0.4*(1 - t), 0, 7); ctx.fill();
  }

  for (const p of g.parts){ ctx.fillStyle = `rgba(110,65,30,${Math.min(1, p.t*2)})`; ctx.fillRect(p.x, p.y, p.s, p.s); }

  if (withDog){
    if (!(g.inv > 0 && Math.floor(T*12) % 2)) drawDog(d.x, d.y, d.dispAng, d.walk, 1, g.inv > 0.6, !!g.charm);
    if (g.started && g.off > g.tol){
      ctx.strokeStyle = `rgba(255,60,60,${0.5 + Math.sin(T*20)*0.3})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(d.x, d.y, 34, 0, 7); ctx.stroke();
      text('!', d.x, d.y - 46, 30, '#ff4040', 'center', '#fff');
    }
  }

  // 어둠
  if (g.st.dark){
    fctx.globalCompositeOperation = 'source-over'; fctx.clearRect(0, 0, W, H);
    fctx.fillStyle = 'rgba(10,5,2,0.96)'; fctx.fillRect(0, GY + 10, W, H - GY);
    fctx.globalCompositeOperation = 'destination-out';
    const hole = (x, y, r) => { const gr = fctx.createRadialGradient(x, y, r*0.35, x, y, r); gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); fctx.fillStyle = gr; fctx.beginPath(); fctx.arc(x, y, r, 0, 7); fctx.fill(); };
    hole(d.x, d.y, 140 + Math.sin(T*3)*4); hole(e[0] - 10, e[1], 55);
    ctx.drawImage(fog, 0, 0, W, H);
  }
  ctx.restore();
}

// ================== 화면 ==================
function drawPlay(){
  const g = G, d = g.dog;
  drawSky();
  const sx = g.shake > 0 ? (Math.random()-0.5)*12*g.shake : 0, sy = g.shake > 0 ? (Math.random()-0.5)*12*g.shake : 0;
  ctx.save(); ctx.translate(0, sy);
  drawWorld(g, sx, true);
  drawGrass();
  ctx.restore();

  for (const p of g.pops){ ctx.globalAlpha = Math.min(1, p.t*2); text(p.text, p.x, p.y, 22, p.color, 'center', 'rgba(60,20,0,0.8)'); ctx.globalAlpha = 1; }

  if (!g.drag){
    const pulse = 1 + Math.sin(T*6)*0.08;
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 3; ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.arc(d.x, d.y, 40*pulse, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    const msg = g.started ? '강아지를 다시 꾹 누르고 이어서 파요!' : '강아지를 꾹 눌러서 출발!';
    const tx = Math.min(W - 200, Math.max(200, d.x + 160));
    ctx.fillStyle = 'rgba(40,20,5,0.75)'; rr(tx - 190, d.y - 95, 380, 40, 14); ctx.fill();
    text(msg, tx, d.y - 75, 20, '#fff');
  }
  if (!g.started && g.st.intro){
    ctx.fillStyle = 'rgba(255,248,230,0.95)'; rr(W/2 - 340, 62, 680, 44, 16); ctx.fill();
    ctx.strokeStyle = '#ffb347'; ctx.lineWidth = 3; ctx.stroke();
    text(g.st.intro, W/2, 85, 20, '#7a3f17');
  }
  drawHUD(g);
}

function drawHUD(g){
  ctx.fillStyle = 'rgba(255,255,255,0.85)'; rr(12, 10, 230, 40, 14); ctx.fill();
  text(`STAGE ${g.i+1} · ${g.st.name}`, 127, 30, 19, '#7a3f17');
  const bw = 280, bx = W/2 - bw/2 + 10, r = g.tLeft / g.time;
  ctx.fillStyle = 'rgba(255,255,255,0.85)'; rr(bx - 6, 14, bw + 12, 32, 14); ctx.fill();
  ctx.fillStyle = r > 0.3 ? '#6cc04a' : (Math.floor(T*6) % 2 ? '#ff5a5a' : '#ff9a5a'); rr(bx, 20, Math.max(0, bw*r), 20, 10); ctx.fill();
  text(`⏱ ${g.tLeft.toFixed(1)}`, bx + bw/2, 30, 18, '#5e3820');
  ctx.fillStyle = 'rgba(255,255,255,0.85)'; rr(W - 232, 10, 220, 40, 14); ctx.fill();
  for (let i = 0; i < 3; i++) heart(W - 210 + i*30, 32, 1.1, i < g.hearts);
  bone(W - 100, 30, 0.9); text(`${g.got}/3`, W - 50, 31, 20, '#7a3f17');
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; rr(12, H - 20, W - 24, 8, 4); ctx.fill();
  ctx.fillStyle = '#ffd23f'; rr(12, H - 20, (W - 24)*g.prog/(g.N-1), 8, 4); ctx.fill();
  if (g.flood && g.flood.idx > 0){ ctx.fillStyle = '#4aa3df'; rr(12, H - 20, (W - 24)*Math.min(1, g.flood.idx/(g.N-1)), 8, 4); ctx.fill(); }
}

// 스테이지 사이 전환: 화면이 오른쪽으로 흘러가며 GOAL이 왼쪽 출발점이 되고, 강아지는 계속 걸어감
function drawTrans(){
  const { old, next, p } = TR, e = ease(Math.min(1, p)), cam = -e*W;
  const a = old.path[old.N-1], b = next.path[0];
  const wx = a[0] + (W + b[0] - a[0]) * Math.min(1, p), wy = a[1] + (b[1] - a[1]) * Math.min(1, p);
  drawSky();
  drawWorld(old, cam, false);
  drawWorld(next, cam + W, false);
  // 두 스테이지를 잇는 굴
  ctx.strokeStyle = '#4a2a16'; ctx.lineWidth = 34; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(a[0] + cam, a[1]); ctx.lineTo(wx + cam, wy); ctx.stroke();
  ctx.strokeStyle = '#5e3820'; ctx.lineWidth = 26; ctx.stroke();
  drawGrass(cam);
  drawDog(wx + cam, wy, 0, T*16, 1);
  const al = Math.sin(Math.min(1, p)*Math.PI);
  ctx.globalAlpha = al;
  text(`STAGE ${next.i + 1}`, W/2, 230, 54, '#ffd23f', 'center', '#7a3f17');
  text(next.st.name, W/2, 285, 32, '#fff', 'center', '#7a3f17');
  ctx.globalAlpha = 1;
}

function drawMenu(){
  drawSky();
  if (!drawMenu.dirt) drawMenu.dirt = makeDirt(42);
  ctx.drawImage(drawMenu.dirt, 0, 0, W, H); drawGrass();
  const wx = ((T*90) % (W + 200)) - 100;
  ctx.strokeStyle = '#5e3820'; ctx.lineWidth = 28; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-50, 560); for (let x = -50; x <= wx; x += 10) ctx.lineTo(x, 560 + Math.sin(x*0.02)*14); ctx.stroke();
  drawDog(wx, 560 + Math.sin(wx*0.02)*14, Math.atan(Math.cos(wx*0.02)*0.28), T*14, 1.1);

  text('닥스훈트의', W/2, 44, 28, '#fff', 'center', '#7a3f17');
  text('땅굴 대모험', W/2, 92, 58, '#ffd23f', 'center', '#7a3f17');
  ctx.fillStyle = 'rgba(40,20,5,0.55)'; rr(W/2 - 330, 150, 660, 370, 24); ctx.fill();
  text('스테이지를 골라주세요', W/2, 180, 24, '#fff');
  const colors = ['#ffb347','#ff8fab','#7cc6fe','#9ad06a','#c79bff'];
  STAGES.forEach((st, i) => {
    const row = Math.floor(i/5), col = i % 5;
    const bx = W/2 - 290 + col*120, by = 210 + row*140, ok = unlocked(i);
    button(bx, by, 100, 70, ok ? String(i+1) : '🔒', () => startStage(i), colors[col], ok);
    text(st.name, bx + 50, by + 88, 15, ok ? '#fff' : '#bbb');
    for (let k = 0; k < 3; k++) star(bx + 26 + k*24, by + 112, 8, k < (save.stars[i] || 0));
  });
}

function drawEnd(){
  drawPlay(); btns = [];
  ctx.fillStyle = 'rgba(20,10,0,0.55)'; ctx.fillRect(0, 0, W, H);
  const r = G.result;
  ctx.fillStyle = '#fff6e8'; rr(W/2 - 250, 110, 500, 380, 28); ctx.fill();
  ctx.strokeStyle = '#ffb347'; ctx.lineWidth = 6; ctx.stroke();
  if (r.win){
    text('스테이지 클리어!', W/2, 160, 44, '#ff8c1a', 'center', '#fff');
    for (let k = 0; k < 3; k++) star(W/2 - 60 + k*60, 225, 24 + (k === 1 ? 6 : 0), k < r.stars);
    text(`점수 ${r.score}`, W/2, 285, 32, '#7a3f17');
    text(`정확도 ${Math.round(r.acc*100)}%  ·  남은 시간 ${G.tLeft.toFixed(1)}초  ·  뼈다귀 ${G.got}/3`, W/2, 322, 18, '#a0683a');
    drawDog(W/2, 365, 0, T*10, 1.1);
    const hasNext = G.i < STAGES.length - 1;
    button(W/2 - 225, 405, 140, 60, '다시하기', () => startStage(G.i), '#9ad06a');
    button(W/2 - 70, 405, 140, 60, '메뉴', () => { scene = 'menu'; }, '#7cc6fe');
    button(W/2 + 85, 405, 140, 60, hasNext ? '다음 ▶' : '처음으로', goNext, '#ffb347');
  } else {
    text('앗, 실패!', W/2, 165, 50, '#ff5a7a', 'center', '#fff');
    text(r.reason, W/2, 225, 28, '#7a3f17');
    drawDog(W/2, 300, 0, 0, 1.3, true);
    text('다시 도전해봐요! 🐾', W/2, 350, 22, '#a0683a');
    button(W/2 - 160, 395, 150, 64, '다시하기', () => startStage(G.i), '#9ad06a');
    button(W/2 + 10, 395, 150, 64, '메뉴', () => { scene = 'menu'; }, '#7cc6fe');
  }
}

// ================== 메인 루프 ==================
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  update(dt);
  btns = [];
  ctx.clearRect(0, 0, W, H);
  if (scene === 'menu') drawMenu();
  else if (scene === 'play') drawPlay();
  else if (scene === 'trans') drawTrans();
  else drawEnd();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
